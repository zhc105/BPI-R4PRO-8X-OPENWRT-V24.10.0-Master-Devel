# Disable bridge netfilter for IP: with flow_offloading enabled it triggers
# nf_nat_oif_changed() conntrack kills on established masqueraded flows
# (root-caused 2026-08-04, see repo memory ppe-swoffload-nat-broken).
# Docker (S99) re-enables these at daemon start; /etc/init.d/zz-bridge-nf
# re-asserts 0 after dockerd. Do NOT remove one without the other.
net.bridge.bridge-nf-call-iptables=0
net.bridge.bridge-nf-call-ip6tables=0
